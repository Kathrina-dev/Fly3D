[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly3d"
version = "0.1.0"
description = "Low-VRAM video to Gaussian splat pipeline powered by Nerfstudio"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fly3d = "fly3d.cli:main"

[tool.setuptools.packages.find]
include = ["fly3d*"]